<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 16px; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 12px; }
      .screen { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 10px; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: bold; }
      .code { fill: #facc15; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; }
      .box-label { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect class="bg" width="960" height="560" />
  <text x="30" y="38" class="title">1. GÖRSEL REHBER: KUTU, BUTON VE FOTOĞRAF DİZİLİMLERİ (FLEXBOX)</text>

  <g transform="translate(25, 60)">
    <rect class="card" width="290" height="225" />
    <text x="15" y="25" class="subtitle">A) ALT ALTA DİZİLİM (Varsayılan)</text>
    <text x="15" y="45" class="code">flexDirection: 'column'</text>
    <text x="15" y="62" class="code">gap: 10, alignItems: 'center'</text>
    
    <rect class="screen" x="65" y="75" width="160" height="135" />
    <rect x="95" y="85" width="100" height="32" rx="6" fill="#ef4444" />
    <text x="145" y="101" class="box-label">1. Kutu / Resim</text>
    <rect x="95" y="126" width="100" height="32" rx="6" fill="#3b82f6" />
    <text x="145" y="142" class="box-label">2. Kutu / Resim</text>
    <rect x="95" y="167" width="100" height="32" rx="6" fill="#22c55e" />
    <text x="145" y="183" class="box-label">3. Kutu / Resim</text>
  </g>

  <g transform="translate(335, 60)">
    <rect class="card" width="290" height="225" />
    <text x="15" y="25" class="subtitle">B) YAN YANA DİZİLİM</text>
    <text x="15" y="45" class="code">flexDirection: 'row'</text>
    <text x="15" y="62" class="code">justifyContent: 'center', gap: 8</text>
    
    <rect class="screen" x="25" y="75" width="240" height="135" />
    <rect x="37" y="112" width="66" height="60" rx="8" fill="#ef4444" />
    <text x="70" y="142" class="box-label">1</text>
    <rect x="112" y="112" width="66" height="60" rx="8" fill="#3b82f6" />
    <text x="145" y="142" class="box-label">2</text>
    <rect x="187" y="112" width="66" height="60" rx="8" fill="#22c55e" />
    <text x="220" y="142" class="box-label">3</text>
  </g>

  <g transform="translate(645, 60)">
    <rect class="card" width="290" height="225" />
    <text x="15" y="25" class="subtitle">C) SOLA VE SAĞA YASLI (Kart Satırı)</text>
    <text x="15" y="45" class="code">flexDirection: 'row'</text>
    <text x="15" y="62" class="code">justifyContent: 'space-between'</text>
    
    <rect class="screen" x="25" y="75" width="240" height="135" />
    <rect x="35" y="90" width="220" height="48" rx="8" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="48" y="114" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold" dominant-baseline="central">Ahmet Yılmaz</text>
    <rect x="185" y="99" width="60" height="30" rx="6" fill="#2563eb" />
    <text x="215" y="114" class="box-label">Okey</text>
    <rect x="35" y="148" width="220" height="48" rx="8" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="48" y="172" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold" dominant-baseline="central">Ayşe Demir</text>
    <rect x="185" y="157" width="60" height="30" rx="6" fill="#db2777" />
    <text x="215" y="172" class="box-label">Okey</text>
  </g>

  <g transform="translate(25, 305)">
    <rect class="card" width="290" height="230" />
    <text x="15" y="25" class="subtitle">D) 2'Lİ IZGARA / GALERİ (Grid)</text>
    <text x="15" y="45" class="code">flexDirection: 'row', flexWrap: 'wrap'</text>
    <text x="15" y="62" class="code">Her kutuya: width: '47%'</text>
    
    <rect class="screen" x="35" y="75" width="220" height="140" />
    <rect x="47" y="85" width="92" height="55" rx="8" fill="#8b5cf6" />
    <text x="93" y="112" class="box-label">Resim 1</text>
    <rect x="151" y="85" width="92" height="55" rx="8" fill="#ec4899" />
    <text x="197" y="112" class="box-label">Resim 2</text>
    <rect x="47" y="148" width="92" height="55" rx="8" fill="#f59e0b" />
    <text x="93" y="175" class="box-label">Resim 3</text>
    <rect x="151" y="148" width="92" height="55" rx="8" fill="#10b981" />
    <text x="197" y="175" class="box-label">Resim 4</text>
  </g>

  <g transform="translate(335, 305)">
    <rect class="card" width="290" height="230" />
    <text x="15" y="25" class="subtitle">E) SOLDA YUVARLAK FOTO + SAĞDA YAZI</text>
    <text x="15" y="45" class="code">Dis View: flexDirection: 'row'</text>
    <text x="15" y="62" class="code">Ic View: flexDirection: 'column'</text>
    
    <rect class="screen" x="25" y="75" width="240" height="140" />
    <rect x="35" y="95" width="220" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="80" cy="143" r="30" fill="#38bdf8" />
    <text x="80" y="143" class="box-label">FOTO</text>
    <text x="125" y="128" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">Hakan Ural</text>
    <text x="125" y="148" fill="#64748b" font-family="sans-serif" font-size="12">Bilgisayar Müh.</text>
    <rect x="125" y="158" width="80" height="22" rx="11" fill="#22c55e" />
    <text x="165" y="169" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Aktif Öğrenci</text>
  </g>

  <g transform="translate(645, 305)">
    <rect class="card" width="290" height="230" />
    <text x="15" y="25" class="subtitle">F) ÜSTTE 2 YAN YANA + ALTTA 1 BÜYÜK</text>
    <text x="15" y="45" class="code">Ust View: flexDirection: 'row'</text>
    <text x="15" y="62" class="code">Alt Image: width: '100%'</text>
    
    <rect class="screen" x="35" y="75" width="220" height="140" />
    <rect x="47" y="85" width="92" height="55" rx="8" fill="#0ea5e9" />
    <text x="93" y="112" class="box-label">Üst Sol</text>
    <rect x="151" y="85" width="92" height="55" rx="8" fill="#6366f1" />
    <text x="197" y="112" class="box-label">Üst Sağ</text>
    <rect x="47" y="148" width="196" height="55" rx="8" fill="#f97316" />
    <text x="145" y="175" class="box-label">Altta Tam Genişlik Büyük Resim</text>
  </g>
</svg>
