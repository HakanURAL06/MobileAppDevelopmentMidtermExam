<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 16px; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 12px; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: bold; }
      .code { fill: #facc15; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; }
      .desc { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .label { fill: #ffffff; font-family: sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect class="bg" width="960" height="440" />
  <text x="30" y="38" class="title">3. GÖRSEL REHBER: FOTOĞRAF ŞEKİLLERİ, ÇERÇEVE, BLUR VE RESIZEMODE</text>

  <g transform="translate(25, 60)">
    <rect class="card" width="220" height="355" />
    <text x="15" y="28" class="subtitle">1) TAM YUVARLAK FOTO</text>
    <circle cx="110" cy="115" r="55" fill="#3b82f6" stroke="#facc15" stroke-width="4" />
    <text x="110" y="115" class="label">110 x 110</text>
    <text x="15" y="198" class="desc">Genişlik ve yükseklik eşit,</text>
    <text x="15" y="215" class="desc">borderRadius tam yarısı!</text>
    <text x="15" y="245" class="code">width: 110,</text>
    <text x="15" y="265" class="code">height: 110,</text>
    <text x="15" y="285" class="code">borderRadius: 55,</text>
    <text x="15" y="305" class="code">borderWidth: 4,</text>
    <text x="15" y="325" class="code">borderColor: '#facc15'</text>
  </g>

  <g transform="translate(260, 60)">
    <rect class="card" width="220" height="355" />
    <text x="15" y="28" class="subtitle">2) KÖŞELERİ YUVARLAK</text>
    <rect x="35" y="60" width="150" height="110" rx="20" fill="#10b981" />
    <text x="110" y="115" class="label">borderRadius: 20</text>
    <text x="15" y="198" class="desc">Kart içindeki standart</text>
    <text x="15" y="215" class="desc">yumuşak köşeli fotoğraf:</text>
    <text x="15" y="245" class="code">width: '100%',</text>
    <text x="15" y="265" class="code">height: 180,</text>
    <text x="15" y="285" class="code">borderRadius: 20,</text>
    <text x="15" y="305" class="code">resizeMode: 'cover'</text>
  </g>

  <g transform="translate(495, 60)">
    <rect class="card" width="220" height="355" />
    <text x="15" y="28" class="subtitle">3) RESIZEMODE FARKLARI</text>
    <rect x="25" y="55" width="170" height="50" rx="6" fill="#ec4899" />
    <text x="110" y="80" class="label">cover (Kutuyu Doldurur)</text>
    <rect x="25" y="115" width="170" height="50" rx="6" fill="#0f172a" stroke="#475569" />
    <rect x="65" y="118" width="90" height="44" rx="4" fill="#8b5cf6" />
    <text x="110" y="140" class="label">contain (Tam Sığar)</text>
    <text x="15" y="198" class="desc">Hoca butonlarla değiştirtirse:</text>
    <text x="15" y="225" class="code">&lt;Image</text>
    <text x="25" y="245" class="code">source={{ uri: url }}</text>
    <text x="25" y="265" class="code">resizeMode={mode}</text>
    <text x="15" y="285" class="code">/&gt;</text>
    <text x="15" y="315" class="desc">Modlar: 'cover', 'contain',</text>
    <text x="15" y="332" class="desc">'stretch', 'center', 'repeat'</text>
  </g>

  <g transform="translate(730, 60)">
    <rect class="card" width="205" height="355" />
    <text x="15" y="28" class="subtitle">4) BLUR &amp; FALLBACK</text>
    <rect x="25" y="60" width="155" height="110" rx="14" fill="#64748b" opacity="0.6" />
    <text x="102" y="105" class="label">Bulanık Resim</text>
    <text x="102" y="128" fill="#facc15" font-family="monospace" font-size="11" text-anchor="middle">blurRadius={18}</text>
    <text x="15" y="198" class="desc">Bulanıklık &amp; Hata Yakalama:</text>
    <text x="15" y="225" class="code">&lt;Image</text>
    <text x="20" y="245" class="code">blurRadius={blur ? 18 : 0}</text>
    <text x="20" y="265" class="code">onError={() =&gt;</text>
    <text x="30" y="285" class="code">setUri(YEDEK_RESIM)</text>
    <text x="20" y="305" class="code">}</text>
    <text x="15" y="325" class="code">/&gt;</text>
  </g>
</svg>
