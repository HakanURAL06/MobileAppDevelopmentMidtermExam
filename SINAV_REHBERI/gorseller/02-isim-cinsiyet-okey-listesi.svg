<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 16px; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .subtitle { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: bold; }
      .phone { fill: #f1f5f9; stroke: #475569; stroke-width: 3; rx: 20px; }
      .ExplainBox { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 12px; }
      .code { fill: #facc15; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .text { fill: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
      .btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect class="bg" width="960" height="500" />
  <text x="30" y="38" class="title">2. GÖRSEL REHBER: İSİM + CİNSİYET + OKEY BUTONU İLE RENK DEĞİŞTİRME</text>

  <g transform="translate(30, 60)">
    <rect class="phone" width="380" height="415" />
    <text x="190" y="32" fill="#0f172a" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Katılımcı Onay Listesi</text>

    <rect x="20" y="48" width="235" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="32" y="70" fill="#94a3b8" font-family="sans-serif" font-size="12">Yeni isim yazın...</text>
    <rect x="265" y="48" width="95" height="36" rx="8" fill="#16a34a" />
    <text x="312" y="66" class="btn-text">+ Ekle</text>

    <rect x="20" y="98" width="340" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text x="36" y="125" fill="#1e3a8a" font-family="sans-serif" font-size="15" font-weight="bold">Ahmet Yılmaz</text>
    <text x="36" y="147" fill="#1d4ed8" font-family="sans-serif" font-size="12">Cinsiyet: Erkek • Durum: Onaylandı</text>
    <rect x="255" y="114" width="90" height="36" rx="8" fill="#2563eb" />
    <text x="300" y="132" class="btn-text">✓ Okey</text>

    <rect x="20" y="178" width="340" height="68" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2" />
    <text x="36" y="205" fill="#831843" font-family="sans-serif" font-size="15" font-weight="bold">Zeynep Kaya</text>
    <text x="36" y="227" fill="#be185d" font-family="sans-serif" font-size="12">Cinsiyet: Kadın • Durum: Onaylandı</text>
    <rect x="255" y="194" width="90" height="36" rx="8" fill="#db2777" />
    <text x="300" y="212" class="btn-text">✓ Okey</text>

    <rect x="20" y="258" width="340" height="68" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <text x="36" y="285" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">Mehmet Demir</text>
    <text x="36" y="307" fill="#64748b" font-family="sans-serif" font-size="12">Cinsiyet: Erkek • Durum: Bekliyor</text>
    <rect x="255" y="274" width="90" height="36" rx="8" fill="#64748b" />
    <text x="300" y="292" class="btn-text">Okey Ver</text>

    <rect x="20" y="338" width="340" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <text x="36" y="362" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">Elif Şahin</text>
    <text x="36" y="382" fill="#64748b" font-family="sans-serif" font-size="12">Cinsiyet: Kadın • Durum: Bekliyor</text>
    <rect x="255" y="349" width="90" height="36" rx="8" fill="#64748b" />
    <text x="300" y="367" class="btn-text">Okey Ver</text>
  </g>

  <g transform="translate(435, 60)">
    <rect class="ExplainBox" width="495" height="415" />
    <text x="20" y="32" class="subtitle">BU EKRANI OLUŞTURAN 3 TEMEL KOD MANTIĞI</text>

    <text x="20" y="65" class="text">1) Kişi Listesi ve Onay Durumu State'i:</text>
    <text x="20" y="88" class="code">const [onaylilar, setOnaylilar] = useState({});</text>
    <text x="20" y="108" class="code">const toggleOkey = (id) =&gt; {</text>
    <text x="35" y="126" class="code">setOnaylilar(prev =&gt; ({ ...prev, [id]: !prev[id] }));</text>
    <text x="20" y="144" class="code">};</text>

    <text x="20" y="180" class="text">2) Okey ve Cinsiyete Göre Renk Seçimi (Ternary):</text>
    <text x="20" y="202" class="code">const okeyMi = !!onaylilar[item.id];</text>
    <text x="20" y="222" class="code">const erkekMi = item.gender === 'Erkek';</text>
    <text x="20" y="245" class="code">const arkaPlan = !okeyMi ? '#ffffff'</text>
    <text x="45" y="265" class="code">: erkekMi ? '#dbeafe' : '#fce7f3';</text>
    <text x="20" y="288" class="code">const butonRenk = !okeyMi ? '#64748b'</text>
    <text x="45" y="308" class="code">: erkekMi ? '#2563eb' : '#db2777';</text>

    <text x="20" y="344" class="text">3) Hoca Farklı Bir Koşul İsterse:</text>
    <text x="20" y="366" class="code">• Geçti/Kaldı: item.not &gt;= 50 ? '#dcfce7' : '#fee2e2'</text>
    <text x="20" y="386" class="code">• Üstü Çizili: textDecorationLine: okeyMi ? 'line-through' : 'none'</text>
    <text x="20" y="404" class="code">• Buton Yeri: flexDirection: 'row', justifyContent: 'space-between'</text>
  </g>
</svg>
